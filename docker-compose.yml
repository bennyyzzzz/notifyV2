# Local development stack. Secrets come from your untracked `.env` (see .env.example).
#   docker compose up -d postgres redis      # only infrastructure, run api/worker with `pnpm dev:*`
#   docker compose --profile app up --build  # everything in containers

name: notify

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://notify_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/notify
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env}
  ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-k1}
  TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://notify_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/notify
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ., target: api }
    <<: *hardening
    environment:
      <<: *app-env
      PORT: 3001
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ., target: worker }
    <<: *hardening
    environment:
      <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
