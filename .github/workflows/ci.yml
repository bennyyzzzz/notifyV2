name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage
      - run: pnpm build
      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- docs/api/openapi.json

  integration:
    name: Database integration (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notify
          # Ephemeral container reachable only from this runner; roles below get random passwords.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: |
          MIGRATOR_PW=$(openssl rand -hex 24)
          APP_PW=$(openssl rand -hex 24)
          echo "::add-mask::$MIGRATOR_PW"
          echo "::add-mask::$APP_PW"
          psql -h localhost -U postgres -d notify -v ON_ERROR_STOP=1 \
            -v migrator_password="$MIGRATOR_PW" -v app_password="$APP_PW" -v db_name=notify \
            -f packages/db/sql/roles.sql
          echo "MIGRATION_DATABASE_URL=postgresql://notify_migrator:$MIGRATOR_PW@localhost:5432/notify" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://notify_app:$APP_PW@localhost:5432/notify" >> "$GITHUB_ENV"
      - name: Apply migrations with the DDL role
        run: pnpm db:migrate
      - name: Migrations match schema.prisma (no drift)
        run: |
          pnpm --filter @notify/db exec prisma migrate diff \
            --from-config-datasource --to-schema=prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
      - name: Integration tests with the runtime role
        run: pnpm turbo run test --filter=@notify/db

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest semgrep scan \
            --config p/owasp-top-ten --config p/typescript --config p/nodejsscan --config p/secrets \
            --error --metrics=off

  images:
    name: Docker images + Trivy
    runs-on: ubuntu-24.04
    needs: [quality]
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: notify-${{ matrix.target }}:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notify-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
